# ╭──────────────────────────────────────────────────────────────────────╮
# │  🎓 Agentic RAG with LangChain & LangGraph: Build GradeWise          │
# │  📦 pyproject.toml: ONE environment for the whole 6-week course      │
# │                                                                      │
# │  You never need to edit this file by hand.                           │
# │    • Add a package:  uv add <package>                                │
# │    • Run anything:   uv run <script.py>                              │
# │  See setup/SETUP-PC.md (or -mac / -linux), Part 3: "The amazing uv"  │
# ╰──────────────────────────────────────────────────────────────────────╯

[project]
name = "gradewise"
version = "0.1.0"
description = "Course repo for 'Agentic RAG with LangChain & LangGraph': build GradeWise, an AI grader for handwritten exams."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Akshat Jain" }]

dependencies = [
    # ── 🧠 LangChain 1.x & LangGraph (weeks 1–5) ─────────────────────
    "langchain>=1.4",
    "langchain-core>=1.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "langsmith>=0.4",
    "langchain-openrouter>=0.2.9",    # default provider: MODEL_MODE cheap + free (one key)
    "langchain-openai>=1.0",          # OpenRouter embeddings (OpenAI-compatible) + custom mode
    "langchain-anthropic>=1.0",       # custom mode: setup/SWAP_PROVIDER.md
    "langchain-google-genai>=3.0",    # custom mode: setup/SWAP_PROVIDER.md
    "langchain-ollama>=1.0",          # free, local route
    "langchain-text-splitters>=1.0",
    "langchain-chroma>=1.0",
    "openai>=2.0",
    "tiktoken>=0.11",
    # ── 📚 RAG: PDFs, vectors, search (week 2) ───────────────────────
    "chromadb>=1.1",
    "pymupdf>=1.25.5,<1.26",         # ⚠️ pinned: see note in setup/troubleshooting.ipynb (Windows App Control)
    "pymupdf4llm>=0.0.17,<0.1",
    "rank-bm25>=0.2.2",
    # ── 🖼️ Vision & handwriting (week 4) ─────────────────────────────
    "pillow>=11.0",
    # ── 📏 Evaluation (weeks 2 & 5) ──────────────────────────────────
    "scikit-learn>=1.7",              # quadratic weighted kappa
    "jiwer>=4.0",                     # CER / WER
    "pandas>=2.3",
    "matplotlib>=3.10",
    # ── 🗄️ Storage & app (weeks 5–6) ─────────────────────────────────
    "sqlmodel>=0.0.24",
    "fastapi>=0.118",
    "uvicorn>=0.37",
    "python-multipart>=0.0.20",
    "streamlit>=1.50",
    # ── 🛠️ Plumbing & the repo's "voice" ─────────────────────────────
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.1",
    "rich>=14.0",
    "typer>=0.19",
    "httpx>=0.28",
    "requests>=2.32",
    # ── 📓 Notebooks ─────────────────────────────────────────────────
    "jupyterlab>=4.4",
    "ipykernel>=6.30",
    "ipywidgets>=8.1",
]

[project.optional-dependencies]
# Heavier extras, used in a few optional comparisons only.
#   uv sync --extra local     → local embeddings (sentence-transformers, pulls in PyTorch)
#   uv sync --extra docling   → Docling PDF parser for the week 2 "loader bake-off"
local = ["sentence-transformers>=5.1", "langchain-huggingface>=1.0"]
docling = ["docling>=2.50"]

[project.scripts]
gradewise = "gradewise.cli:app"

[dependency-groups]
dev = ["ruff>=0.13", "pytest>=8.4", "nbstripout>=0.8", "nbconvert>=7.16"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gradewise"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["community_contributions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
